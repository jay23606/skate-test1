<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>skate-test1</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="hud">
      <div class="brand">SKATE-TEST1</div>
      <div class="stats">
        <span>Score <strong id="score">0</strong></span>
        <span>Best <strong id="best">0</strong></span>
      </div>
      <div id="message">Press Space or tap to start</div>
      <div class="controls">A / D or ← / → to move · Space to jump · R to restart</div>
    </div>
    <div id="game"></div>
    <script type="module" src="./game.js"></script>
  </body>
</html>
